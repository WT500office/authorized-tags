<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Authorized Tags — Inspection</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#182334;background:#f4f6f9}
*{box-sizing:border-box}body{margin:0;padding:8px}.app{max-width:960px;margin:auto}
.header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}
h1{font-size:22px;margin:0;line-height:1.15}.settings{font:inherit;font-size:13px;border:1px solid #cad3de;border-radius:7px;background:white;padding:5px 9px;color:#182334}
.header-actions{display:flex;align-items:center;gap:6px}.photo-preview{background:white;border:1px solid #dce2eb;border-radius:9px;padding:10px;margin-bottom:8px}.photo-preview img{display:block;max-width:100%;max-height:230px;object-fit:contain;margin:8px auto}.photo-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.summary{display:flex;flex-wrap:wrap;align-items:center;gap:5px 14px;font-size:13px;margin:4px 0 8px}.summary b{font-size:14px}.muted{color:#526174}
.tags{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;touch-action:pan-y}
.tag{min-width:0;min-height:39px;padding:6px 2px;border:1px solid #d9e0e9;border-radius:6px;background:white;font:650 15px system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;color:#182334;overflow-wrap:anywhere;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:pointer}
.tag:focus-visible,.settings:focus-visible{outline:3px solid #2563eb;outline-offset:1px}.tag.found{background:#dce9df;color:#476451;border-color:#a8c3ae;text-decoration:line-through;opacity:.75}
.import{background:white;border:1px solid #dce2eb;border-radius:9px;padding:10px;margin-bottom:8px}.import label{display:block;font-size:13px;margin-bottom:5px}.import input{max-width:100%;font-size:14px}.message{color:#98283c;font-size:13px;margin:4px 0}.hidden{display:none}
@media(min-width:700px){.tag{min-height:43px;font-size:17px}.summary{font-size:14px}}
</style>
</head>
<body><main class="app">
<div class="header"><h1>Authorized Tags</h1><div class="header-actions"><button id="camera" class="settings" type="button">Camera</button><button id="settings" class="settings" type="button" aria-expanded="false">Update List</button></div></div>
<input id="photo-file" type="file" accept="image/*" capture="environment" class="hidden" aria-label="Take parking photo"><section id="photo-preview" class="photo-preview hidden"><div class="photo-actions"><strong id="photo-name"></strong><button id="save-photo" class="settings" type="button">Save Photo</button><button id="discard-photo" class="settings" type="button">Close</button></div><img id="photo-image" alt="Parking photograph preview"></section>
<section id="import" class="import hidden"><label for="file">Select AuthorizedTags.csv</label><input id="file" type="file" accept=".csv,text/csv,text/plain"></section>
<div id="message" class="message" role="status"></div>
<section id="result" class="hidden"><div class="summary"><span><span class="muted">Updated:</span> <b id="date"></b> <b id="time"></b></span><span><span class="muted">Authorized:</span> <b id="count"></b></span><span><span class="muted">Found:</span> <b id="found">0</b></span></div><div id="tags" class="tags"></div></section>
</main>
<script>
'use strict';
function parseCSV(source){
 const rows=[];let row=[],cell='',quoted=false;
 source=source.replace(/^\uFEFF/,'');
 for(let i=0;i<source.length;i++){
  const c=source[i];
  if(quoted){if(c==='"'&&source[i+1]==='"'){cell+='"';i++;}else if(c==='"'){quoted=false;}else{cell+=c;}}
  else if(c==='"'&&cell===''){quoted=true;}
  else if(c===','){row.push(cell);cell='';}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&source[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v.trim()!==''))rows.push(row);row=[];cell='';}
  else{cell+=c;}
 }
 if(quoted)throw new Error('The CSV contains an unclosed quotation mark.');
 row.push(cell);if(row.some(v=>v.trim()!==''))rows.push(row);
 return rows;
}
const fileInput=document.getElementById('file'),message=document.getElementById('message'),result=document.getElementById('result');
const storageKey='wt500-authorized-tags-inspection-v1';
const importPanel=document.getElementById('import'),settingsButton=document.getElementById('settings');

const photoInput=document.getElementById('photo-file'),photoPanel=document.getElementById('photo-preview');
const photoImage=document.getElementById('photo-image'),photoName=document.getElementById('photo-name');
let photoUrl=null,photoBlob=null,photoFilename='';
function clearPhoto(){
 photoPanel.classList.add('hidden');photoImage.removeAttribute('src');
 if(photoUrl)URL.revokeObjectURL(photoUrl);
 photoUrl=null;photoBlob=null;photoFilename='';photoInput.value='';
 if(message.textContent.startsWith('Use the iPad save/share options'))message.textContent='';
}
document.getElementById('camera').addEventListener('click',()=>photoInput.click());
photoInput.addEventListener('change',()=>{
 const file=photoInput.files?.[0];if(!file)return;
 if(!file.type.startsWith('image/')){message.textContent='Please select an image.';return;}
 clearPhoto();
 const now=new Date(),pad=n=>String(n).padStart(2,'0');
 const stamp=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())+'_'+pad(now.getHours())+'-'+pad(now.getMinutes())+'-'+pad(now.getSeconds());
 const ext=file.type==='image/png'?'png':file.type==='image/heic'?'heic':file.type==='image/heif'?'heif':'jpg';
 photoFilename='Parking_'+stamp+'.'+ext;photoBlob=file;
 photoUrl=URL.createObjectURL(file);photoImage.src=photoUrl;
 photoName.textContent=photoFilename;photoPanel.classList.remove('hidden');
 message.textContent='';
});
document.getElementById('save-photo').addEventListener('click',()=>{
 if(!photoBlob)return;
 const link=document.createElement('a');link.href=photoUrl;link.download=photoFilename;
 document.body.append(link);link.click();link.remove();
 message.textContent='Use the iPad save/share options to store the photo in Parking Photos. Confirm the file was saved before closing the preview.';
});
document.getElementById('discard-photo').addEventListener('click',clearPhoto);

function showImport(open){importPanel.classList.toggle('hidden',!open);settingsButton.setAttribute('aria-expanded',String(open));}
settingsButton.addEventListener('click',()=>showImport(importPanel.classList.contains('hidden')));
let current=null;
function persist(){
 try{localStorage.setItem(storageKey,JSON.stringify(current));return true;}
 catch(err){message.textContent='Browser storage is unavailable. Keep this page open during inspection.';return false;}
}
function display(data){
 current=data;
 document.getElementById('date').textContent=data.date||'—';
 document.getElementById('time').textContent=data.time||'—';
 document.getElementById('count').textContent=String(data.tags.length);
 const list=document.getElementById('tags');list.replaceChildren();
 const foundCount=document.getElementById('found');
 const updateCount=()=>{foundCount.textContent=String(data.found.filter(Boolean).length);};
 data.tags.forEach((tag,index)=>{
  const button=document.createElement('button');button.type='button';button.className='tag';button.textContent=tag;
  function update(){button.classList.toggle('found',Boolean(data.found[index]));button.setAttribute('aria-pressed',String(Boolean(data.found[index])));}
  update();
  let downX=0,downY=0,moved=false,suppressClick=false;
  button.addEventListener('pointerdown',e=>{downX=e.clientX;downY=e.clientY;moved=false;suppressClick=false;});
  button.addEventListener('pointermove',e=>{if(Math.hypot(e.clientX-downX,e.clientY-downY)>9)moved=true;});
  button.addEventListener('pointerup',()=>{if(moved)suppressClick=true;});
  button.addEventListener('pointercancel',()=>{suppressClick=true;});
  button.addEventListener('click',()=>{if(suppressClick||moved){suppressClick=false;moved=false;return;}data.found[index]=!data.found[index];update();updateCount();persist();});
  list.append(button);
 });
 if(data.tags.length===0){const div=document.createElement('div');div.textContent='No authorized tags in this file.';list.append(div);}
 updateCount();result.classList.remove('hidden');
}
try{
 const saved=localStorage.getItem(storageKey);
 if(saved){const data=JSON.parse(saved);
  if(data&&Array.isArray(data.tags)&&Array.isArray(data.found)&&data.tags.length===data.found.length)display(data);
 }
}catch(err){message.textContent='Previously saved inspection data could not be restored.';}
if(!current)showImport(true);

fileInput.addEventListener('change',async()=>{
 message.textContent='';
 const file=fileInput.files?.[0];if(!file)return;
 try{
  const rows=parseCSV(await file.text());
  if(rows.length===0)throw new Error('The CSV is empty.');
  const headers=rows[0].map(v=>v.trim().toLowerCase());
  const d=headers.indexOf('date'),t=headers.indexOf('time'),a=headers.indexOf('tag');
  if(d<0||t<0||a<0)throw new Error('Expected CSV columns: Date, Time, Tag.');
  const entries=rows.slice(1).filter(r=>(r[a]||'').trim()!=='');
  const tags=entries.map(r=>r[a].trim()).sort((x,y)=>x.localeCompare(y,undefined,{numeric:true,sensitivity:'base'}));
  const data={date:entries[0]?.[d]?.trim()||'',time:entries[0]?.[t]?.trim()||'',tags,found:tags.map(()=>false)};
  display(data);
  persist();
  showImport(false);
 }catch(err){message.textContent=err.message||'Unable to read the CSV.';}
});
</script>
</body></html>
